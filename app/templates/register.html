{% extends "base.html" %}

{% block title %}Cadastro - PRF Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
  <h2 class="text-xl font-bold text-white tracking-tight mb-1">Cadastrar Conta</h2>
  <p class="text-xs text-slate-400 mb-6">Inicie sua preparação de alto nível com métricas do Cebraspe.</p>

  <form action="/auth/register" method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Nome Completo</label>
      <input type="text" name="name" required placeholder="Douglas Lima" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail</label>
      <input type="email" name="email" required placeholder="seuemail@exemplo.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Senha (mínimo 6 caracteres)</label>
      <input type="password" name="password" minlength="6" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
    </div>

    <button type="submit" class="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-lg text-xs transition-colors">
      Criar Conta
    </button>
  </form>

  <p class="text-xs text-slate-500 mt-4 text-center">
    Já possui acesso? <a href="/login" class="text-amber-400 hover:underline">Fazer login</a>
  </p>
</div>
{% endblock %}
