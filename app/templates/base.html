<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PRF Tracker - Underline Tech{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="border-b border-slate-800 bg-slate-900/80 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-amber-400 font-extrabold tracking-tight text-lg">PRF Tracker</span>
      <span class="text-xs text-slate-400 font-mono">| Cebraspe 2027</span>
    </div>
    <nav class="flex items-center gap-4 text-xs">
      {% block nav %}{% endblock %}
    </nav>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-900 py-4 text-center text-xs text-slate-600">
    PRF Tracker · Underline Tech · Backend FastAPI / SQLAlchemy 2.0
  </footer>
</body>
</html>
