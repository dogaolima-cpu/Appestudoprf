{% extends "base.html" %}

{% block title %}Login - PRF Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
  <h2 class="text-xl font-bold text-white tracking-tight mb-1">Acesso do Aluno PRF</h2>
  <p class="text-xs text-slate-400 mb-6">Entre com seu e-mail e senha para acessar suas métricas Cebraspe.</p>

  <form action="/auth/login" method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail</label>
      <input type="email" name="email" required placeholder="seuemail@exemplo.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
      <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
    </div>

    <button type="submit" class="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-lg text-xs transition-colors">
      Entrar no Sistema
    </button>
  </form>

  <p class="text-xs text-slate-500 mt-4 text-center">
    Ainda não tem conta? <a href="/register" class="text-amber-400 hover:underline">Cadastre-se</a>
  </p>
</div>
{% endblock %}
