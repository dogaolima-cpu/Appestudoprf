<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Tático - PRF Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-amber-500 selection:text-slate-950">

  <!-- Background Tactical Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none opacity-20">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-amber-500/20 blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
    
    <!-- Brand / Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 mb-3">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">PRF Tracker</h1>
      <p class="text-xs text-slate-400 mt-1">Sistema Tático de Métricas Cebraspe · Edital 2027</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="flex p-1 bg-slate-950 border border-slate-800 rounded-lg mb-6">
      <button 
        id="tab-login" 
        onclick="switchMode('login')"
        class="flex-1 py-2 text-xs font-bold rounded-md transition-all bg-amber-400 text-slate-950 shadow-sm"
      >
        Acessar Conta
      </button>
      <button 
        id="tab-register" 
        onclick="switchMode('register')"
        class="flex-1 py-2 text-xs font-bold rounded-md transition-all text-slate-400 hover:text-white"
      >
        Criar Nova Conta
      </button>
    </div>

    <!-- Alert Container -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border flex items-start gap-2">
      <span id="alert-icon" class="mt-0.5 shrink-0"></span>
      <span id="alert-message" class="leading-relaxed"></span>
    </div>

    <!-- Auth Form -->
    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
      
      <!-- Name Field (Only in Register Mode) -->
      <div id="field-name" class="hidden">
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nome do Candidato</label>
        <div class="relative">
          <input 
            type="text" 
            id="input-name"
            placeholder="Ex: Douglas Lima" 
            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-amber-400 transition-colors"
          >
        </div>
      </div>

      <!-- Email Field -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Endereço de E-mail</label>
        <input 
          type="email" 
          id="input-email"
          required 
          placeholder="candidato@prf.gov.br" 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-amber-400 transition-colors"
        >
      </div>

      <!-- Password Field -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Senha de Acesso</label>
        <input 
          type="password" 
          id="input-password"
          required 
          minlength="6"
          placeholder="••••••••" 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-amber-400 transition-colors"
        >
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submit-btn"
        class="w-full py-2.5 px-4 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-lg text-xs transition-colors flex items-center justify-center gap-2 shadow-sm cursor-pointer mt-2"
      >
        <span id="btn-text">Entrar no Painel Tático</span>
      </button>

    </form>

    <!-- Footer Security Note -->
    <div class="mt-6 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500 font-mono">
      <span>Proteção Bcrypt · Sessão Segura HttpOnly</span>
    </div>

  </div>

  <script>
    let currentMode = 'login';

    function switchMode(mode) {
      currentMode = mode;
      hideAlert();

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const fieldName = document.getElementById('field-name');
      const inputName = document.getElementById('input-name');
      const btnText = document.getElementById('btn-text');

      if (mode === 'login') {
        tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all bg-amber-400 text-slate-950 shadow-sm';
        tabRegister.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all text-slate-400 hover:text-white';
        fieldName.classList.add('hidden');
        inputName.removeAttribute('required');
        btnText.innerText = 'Entrar no Painel Tático';
      } else {
        tabRegister.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all bg-amber-400 text-slate-950 shadow-sm';
        tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all text-slate-400 hover:text-white';
        fieldName.classList.remove('hidden');
        inputName.setAttribute('required', 'true');
        btnText.innerText = 'Criar Conta e Acessar';
      }
    }

    function showAlert(type, message) {
      const box = document.getElementById('alert-box');
      const text = document.getElementById('alert-message');
      box.className = type === 'error'
        ? 'mb-4 p-3 rounded-lg text-xs font-medium border bg-rose-950/60 border-rose-800 text-rose-300 flex items-start gap-2'
        : 'mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-950/60 border-emerald-800 text-emerald-300 flex items-start gap-2';
      text.innerText = message;
      box.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alert-box').classList.add('hidden');
    }

    async function handleAuth(event) {
      event.preventDefault();
      hideAlert();

      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const name = document.getElementById('input-name').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      submitBtn.disabled = true;
      btnText.innerText = 'Processando credenciais...';

      const endpoint = currentMode === 'login' ? '/auth/login' : '/auth/register';
      const payload = currentMode === 'login'
        ? { email, password }
        : { name, email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // Envia e recebe Cookies de Sessão HttpOnly
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          const errorMsg = data.detail || (currentMode === 'login' ? 'E-mail ou senha incorretos.' : 'Erro ao cadastrar candidato.');
          showAlert('error', errorMsg);
          submitBtn.disabled = false;
          btnText.innerText = currentMode === 'login' ? 'Entrar no Painel Tático' : 'Criar Conta e Acessar';
          return;
        }

        // Suporte Híbrido: Salvar access_token no localStorage caso retornado
        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
        } else if (data.token) {
          localStorage.setItem('access_token', data.token);
        }

        if (data.name) {
          localStorage.setItem('user_name', data.name);
        } else if (name) {
          localStorage.setItem('user_name', name);
        }

        showAlert('success', 'Autenticação bem-sucedida! Carregando painel...');
        
        // Redireciona para o Dashboard
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);

      } catch (err) {
        console.error('Falha de rede:', err);
        showAlert('error', 'Falha na conexão com o servidor. Verifique sua internet.');
        submitBtn.disabled = false;
        btnText.innerText = currentMode === 'login' ? 'Entrar no Painel Tático' : 'Criar Conta e Acessar';
      }
    }
  </script>
</body>
</html>
